name: CI

on:
  push:
    branches: [main]
  pull_request:

# Aucun secret de production n'est exposé ici : le build tourne avec des
# valeurs factices, et rien ne se connecte à la vraie base.
permissions:
  contents: read

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # nécessaire au balayage de secrets sur l'historique du diff

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installation déterministe
        run: npm ci

      # Avant les tests : c'est le contrôle le plus rapide, et il attrape une
      # classe d'erreur qu'aucun des suivants ne voit. `no-undef` a trouvé deux
      # identifiants libres livrés en production — un dans l'envoi d'offre par
      # e-mail, un dans le chemin d'erreur de l'import bancaire.
      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build de production
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key

      # Bloque sur « critical » seulement : une alerte « high » dans une
      # dépendance imbriquée de Next ne doit pas empêcher de livrer un correctif.
      #
      # Passé par un script plutôt qu'en une ligne : le 4 septembre 2026,
      # l'endpoint d'audit de npm a répondu 503, `npm audit` a attendu sept
      # minutes puis échoué, et deux builds sont partis au rouge sur du code
      # sain. Le script réessaie, borne l'attente, et distingue « faille
      # critique » (bloquant) de « npm injoignable » (avertissement).
      - name: Audit des dépendances
        run: npm run check:audit

      - name: Détection de secrets
        run: npm run check:secrets
